
        <!DOCTYPE html>
        <html>
        <head>
            <title>LIVE Mat Updates</title>
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
            <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
            <style>
                body { font-family: 'Segoe UI', sans-serif; background: #0f1418; color: white; text-align: center; margin: 0; }
                .header { background: #1e272e; padding: 15px; border-bottom: 2px solid #3d4e5d; }
                .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; padding: 20px; }
                .mat-card { background: #1e272e; border-radius: 12px; border: 1px solid #3d4e5d; padding: 15px; }
                .mat-title { color: #f1c40f; font-size: 2.2em; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #f1c40f; }
                .bout-item { background: #2c3e50; margin: 10px 0; padding: 12px; border-radius: 8px; text-align: left; border-left: 6px solid #7f8c8d; }
                .on-mat { background: #1e8449; border-left-color: #2ecc71; animation: pulse 2s infinite; }
                @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }
                .bout-info { color: #f1c40f; font-weight: bold; font-size: 0.9em; }
                .row { display: flex; justify-content: space-between; font-size: 1.2em; margin-top: 5px; }
                .score { background: #000; padding: 0 10px; border-radius: 4px; font-family: monospace; }
            </style>
        </head>
        <body>
            <div class="header">
                <h1 style="margin:0; color:#f1c40f;">MATLOGIC LIVE</h1>
                <div id="status" style="font-size:0.8em; color:#576574;">Connecting to champ1...</div>
            </div>
            <div id="mats-container" class="grid"></div>

            <script>
                // --- PASTE YOUR FIREBASE CONFIG FROM THE CONSOLE HERE ---
                const firebaseConfig = {
                    apiKey: "AIzaSyBGjMTZrCECti5IZzL97WVvxeNamj5_dro",
                    authDomain: "wrestlingmeets.firebaseapp.com",
                    projectId: "wrestlingmeets",
                    storageBucket: "wrestlingmeets.firebasestorage.app",
                    messagingSenderId: "394639475458",
                    appId: "1:394639475458:web:1565c701b0380a0927781b",
                    measurementId: "G-MGR265DR0W"
                };

                firebase.initializeApp(firebaseConfig);
                const db = firebase.firestore();

                // Listen to the exact same path as the Python script
                db.collection("meets").doc("champ1").collection("bouts")
                .onSnapshot((snapshot) => {
                    document.getElementById('status').innerText = "Live Syncing: " + snapshot.size + " bouts found";
                    const mats = {};
                    
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        const matNum = d.Mat || "1";
                        if (d.Status !== "Completed" && matNum.toUpperCase() !== "N/A") {
                            if (!mats[matNum]) mats[matNum] = [];
                            mats[matNum].push(d);
                        }
                    });

                    const container = document.getElementById('mats-container');
                    container.innerHTML = '';

                    Object.keys(mats).sort((a, b) => parseInt(a) - parseInt(b)).forEach(m => {
                        let html = `<div class="mat-card"><div class="mat-title">MAT ${m}</div>`;
                        
                        // Sort by Index (same as local board)
                        mats[m].sort((a, b) => (a.Index || 0) - (b.Index || 0)).slice(0, 5).forEach((b, i) => {
                            const isFirst = (i === 0 && b.Status !== "Pending") || b.Status === "In Progress";
                            html += `
                                <div class="bout-item ${isFirst ? 'on-mat' : ''}">
                                    <div class="bout-info">BOUT ${b.Bout} - ${b.Weight}</div>
                                    <div class="row"><span>${b.RedName || 'TBD'}</span><span class="score">${b.RedScore || 0}</span></div>
                                    <div class="row"><span>${b.BlueName || 'TBD'}</span><span class="score">${b.BlueScore || 0}</span></div>
                                </div>`;
                        });
                        container.innerHTML += html + '</div>';
                    });
                });
            </script>
        </body>
        </html>
